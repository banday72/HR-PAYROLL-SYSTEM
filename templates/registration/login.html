<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HR Payroll System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    {% load static %}
    <style>
        body { background: linear-gradient(135deg, #1a5276 0%, #2980b9 50%, #5dade2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { border: none; border-radius: 1rem; box-shadow: 0 0.5rem 2rem rgba(0,0,0,.15); max-width: 420px; width: 100%; }
        .login-header { background: white; border-radius: 1rem 1rem 0 0; padding: 2rem; text-align: center; }
        .login-header img { max-width: 200px; height: auto; margin-bottom: 0.5rem; }
        .login-header h3 { color: #1a5276; font-weight: 700; margin-bottom: 0.25rem; }
        .login-header p { color: #5dade2; }
        .form-control:focus { border-color: #2980b9; box-shadow: 0 0 0 0.2rem rgba(41,128,185,.25); }
        .btn-login { background: linear-gradient(135deg, #1a5276, #2980b9); border: none; padding: 0.75rem; font-weight: 600; }
        .btn-login:hover { background: linear-gradient(135deg, #154360, #1a5276); }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="login-header">
            <img src="{% static 'images/logo.svg' %}" alt="MTBC CoreCloud">
            <h3>HR Payroll System</h3>
            <p class="mb-0">Sign in to your account</p>
        </div>
        <div class="card-body p-4">
            {% if form.errors %}
            <div class="alert alert-danger">
                Invalid username or password. Please try again.
            </div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-login text-white w-100 mb-3">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>
        </div>
    </div>
</body>
</html>

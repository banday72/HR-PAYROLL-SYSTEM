<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HR Payroll System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a5276'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='36' font-weight='900' fill='white' text-anchor='middle'%3EHR%3C/text%3E%3C/svg%3E">
    <style>
        body { background: linear-gradient(135deg, #1a5276 0%, #2980b9 50%, #5dade2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { border: none; border-radius: 1rem; box-shadow: 0 0.5rem 2rem rgba(0,0,0,.2); max-width: 420px; width: 100%; }
        .login-header { background: white; border-radius: 1rem 1rem 0 0; padding: 2.5rem 2rem 1.5rem; text-align: center; }
        .login-logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 1rem; }
        .login-header h3 { color: #1a5276; font-weight: 700; margin-bottom: 0.15rem; font-size: 1.2rem; }
        .login-header p { color: #5dade2; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.5px; }
        .form-control:focus { border-color: #2980b9; box-shadow: 0 0 0 0.2rem rgba(41,128,185,.25); }
        .btn-login { background: linear-gradient(135deg, #1a5276, #2980b9); border: none; padding: 0.75rem; font-weight: 600; }
        .btn-login:hover { background: linear-gradient(135deg, #154360, #1a5276); }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="login-header">
            <div class="login-logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 100 100">
                    <rect x="2" y="2" width="46" height="46" rx="6" fill="#1a5276"/>
                    <text x="25" y="35" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="900" fill="white" text-anchor="middle">M</text>
                    <rect x="52" y="2" width="46" height="46" rx="6" fill="#2980b9"/>
                    <text x="75" y="35" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="900" fill="white" text-anchor="middle">T</text>
                    <rect x="2" y="52" width="46" height="46" rx="6" fill="#5dade2"/>
                    <text x="25" y="85" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="900" fill="white" text-anchor="middle">B</text>
                    <rect x="52" y="52" width="46" height="46" rx="6" fill="#aed6f1"/>
                    <text x="75" y="85" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="900" fill="#1a5276" text-anchor="middle">C</text>
                </svg>
            </div>
            <h3>HR Payroll System</h3>
            <p>CoreCloud</p>
        </div>
        <div class="card-body p-4">
            {% if form.errors %}
            <div class="alert alert-danger">
                Invalid username or password. Please try again.
            </div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-login text-white w-100 mb-3">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>
        </div>
    </div>
</body>
</html>

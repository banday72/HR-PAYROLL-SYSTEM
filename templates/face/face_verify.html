{% extends "base.html" %}
{% block title %}Face Verification{% endblock %}
{% block page_title %}Face Verification{% endblock %}
{% block content %}
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
.face-container { max-width: 500px; margin: 0 auto; }
#video { width: 100%; border-radius: 12px; border: 3px solid #2980b9; }
#overlay { position: absolute; top: 0; left: 0; }
.video-wrapper { position: relative; display: inline-block; width: 100%; }
.status-box { padding: 15px; border-radius: 10px; margin-top: 15px; text-align: center; font-weight: 600; }
.status-box.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
.status-box.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
.status-box.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
.status-box.warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
</style>
<div class="face-container">
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">
                <i class="fas fa-fingerprint me-1"></i>Face Verification
            </h6>
        </div>
        <div class="card-body text-center">
            <p class="text-muted">Position your face in the camera to verify your identity</p>

            <div class="video-wrapper mb-3">
                <video id="video" autoplay muted></video>
                <canvas id="overlay" style="position:absolute;top:0;left:0;"></canvas>
            </div>

            <div id="statusBox" class="status-box info">
                <i class="fas fa-info-circle"></i> Click "Start Camera" to begin verification
            </div>

            <div class="d-grid gap-2 mt-3">
                <button id="startBtn" class="btn btn-primary" onclick="startCamera()">
                    <i class="fas fa-camera me-1"></i>Start Camera
                </button>
                <button id="verifyBtn" class="btn btn-success" onclick="verifyFace()" style="display:none;">
                    <i class="fas fa-fingerprint me-1"></i>Verify My Face
                </button>
            </div>

            <div class="mt-3">
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-arrow-left me-1"></i>Skip for Now
                </a>
            </div>
        </div>
    </div>
</div>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const statusBox = document.getElementById('statusBox');
const startBtn = document.getElementById('startBtn');
const verifyBtn = document.getElementById('verifyBtn');
let modelsLoaded = false;

async function loadModels() {
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
    try {
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
        modelsLoaded = true;
    } catch (e) {
        try {
            const altUrl = '/static/models/';
            await faceapi.nets.tinyFaceDetector.loadFromUri(altUrl);
            await faceapi.nets.faceLandmark68Net.loadFromUri(altUrl);
            await faceapi.nets.faceRecognitionNet.loadFromUri(altUrl);
            modelsLoaded = true;
        } catch (e2) {
            setStatus('Error loading models. Please refresh.', 'error');
        }
    }
}

function setStatus(msg, type) {
    statusBox.className = 'status-box ' + type;
    statusBox.innerHTML = '<i class="fas fa-' + (type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : type === 'warning' ? 'exclamation-triangle' : 'info-circle') + '"></i> ' + msg;
}

async function startCamera() {
    setStatus('Loading face detection models...', 'info');
    await loadModels();
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
        video.srcObject = stream;
        startBtn.style.display = 'none';
        verifyBtn.style.display = 'block';
        setStatus('Camera active. Click "Verify My Face" to verify.', 'info');
        detectFaces();
    } catch (e) {
        setStatus('Cannot access camera. Please allow camera permission.', 'error');
    }
}

async function detectFaces() {
    if (!modelsLoaded) return;
    const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks().withFaceDescriptors();
    const canvas = faceapi.createCanvasFromMedia(video);
    overlay.width = canvas.width;
    overlay.height = canvas.height;
    overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
    const displaySize = { width: video.videoWidth, height: video.videoHeight };
    faceapi.matchDimensions(canvas, displaySize);
    const resized = faceapi.resizeResults(detections, displaySize);
    resized.forEach(d => {
        const box = d.detection.box;
        overlay.getContext('2d').strokeStyle = '#28a745';
        overlay.getContext('2d').lineWidth = 3;
        overlay.getContext('2d').strokeRect(box.x, box.y, box.width, box.height);
    });
    requestAnimationFrame(detectFaces);
}

async function verifyFace() {
    if (!modelsLoaded) return;
    setStatus('Processing face...', 'info');
    const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks().withFaceDescriptors();
    if (detections.length === 0) {
        setStatus('No face detected. Please try again.', 'error');
        return;
    }
    const descriptors = detections.map(d => Array.from(d.descriptor));
    try {
        const response = await fetch('/face-verify/check/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
            body: JSON.stringify({ descriptors: descriptors })
        });
        const result = await response.json();
        if (result.status === 'ok') {
            setStatus('Face verified! Redirecting to dashboard...', 'success');
            setTimeout(() => { window.location.href = '/'; }, 1500);
        } else {
            setStatus('Face not matched. ' + result.message + ' Try again or skip.', 'error');
        }
    } catch (e) {
        setStatus('Error verifying face. Please try again.', 'error');
    }
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}
